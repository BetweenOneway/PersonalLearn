<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport：移动端适配核心，禁止缩放、适配设备宽度 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS八股全覆盖 · 逐行注释</title>
  <style>
    /* ===================== 1. CSS变量 + 全局重置（工程必备） ===================== */
    /* :root 根元素，定义全局CSS自定义属性（变量），可JS读写 */
    :root {
      --primary: #1677ff;
      --gap: 16px;
      --radius: 8px;
      --shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    /* 通配选择器，统一盒模型，清除内外边距默认值 */
    * {
      margin: 0;
      padding: 0;
      /* border-box：宽高包含border+padding，业务首选；content-box 默认，宽高仅内容区 */
      box-sizing: border-box;
    }
    html {
      font-size: 16px; /* rem基准字号 */
      line-height: 1.5; /* 行高继承，优化文本可读性 */
      scroll-behavior: smooth; /* 锚点平滑滚动 */
    }
    body {
      font-family: system-ui, -apple-system, sans-serif; /* 系统无衬线字体，跨平台兼容 */
      color: #333;
      background-color: #f5f7fa;
    }
    ul { list-style: none; } /* 清除列表圆点 */
    a { text-decoration: none; color: inherit; } /* 清除下划线，颜色继承父级 */
    img { max-width: 100%; display: block; } /* 图片自适应，消除底部空白缝隙 */

    /* ===================== 2. 选择器 + 权重优先级示范 ===================== */
    /* 元素选择器：权重 0,0,0,1 */
    div { color: #444; }
    /* 类选择器：权重 0,0,1,0 */
    .wrap { margin: 24px auto; width: min(1200px, 96%); }
    /* ID选择器：权重 0,1,0,0 */
    #header { background: #fff; padding: 20px; border-radius: var(--radius); }
    /* 子代选择器 >：仅直接子元素；后代空格：所有后代 */
    .box > .item { padding: 8px; }
    /* 相邻兄弟 +：紧挨着的下一个兄弟 */
    .item + .item { margin-top: 8px; }
    /* 通用兄弟 ~：后面所有同级兄弟 */
    .item ~ .tip { color: #666; }
    /* 属性选择器 */
    input[type="text"] { border: 1px solid #ddd; }
    /* 伪类（状态）：hover/active/focus-visited 权重同类选择器 */
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--primary); }
    /* 伪元素 ::before / ::after，必须带content，权重同类 */
    .title::before { content: "【"; color: var(--primary); }
    .title::after { content: "】"; color: var(--primary); }

    /* ===================== 3. 盒模型 + BFC + 浮动清除（面试高频） ===================== */
    /* BFC：块级格式化上下文，独立渲染区域 */
    /* 触发BFC常用：overflow不为visible / display:inline-block/flex/grid / float非none / position:absolute/fixed */
    .box-bfc {
      width: 300px;
      padding: 20px;
      border: 1px solid #eee;
      margin: 16px 0;
      overflow: hidden; /* 触发BFC：解决内部浮动高度塌陷、上下margin合并 */
    }
    .float-left {
      float: left; /* 脱离普通文档流，文字环绕 */
      width: 80px;
      height: 80px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      line-height: 80px;
    }
    /* 经典clearfix 清除浮动，兼容旧浏览器 */
    .clearfix::after {
      content: "";
      display: block;
      clear: both;
    }

    /* ===================== 4. 定位体系 5种position + z-index层叠上下文 ===================== */
    /* static 默认：正常文档流，top/left/z-index无效 */
    /* relative：相对自身原始位置，不脱离文档流，保留占位 */
    /* absolute：相对最近非static定位父级，脱离文档流 */
    /* fixed：相对视口，固定悬浮 */
    /* sticky：粘性定位，relative + fixed结合，到达阈值后固定 */
    .pos-wrap {
      position: relative; /* 作为absolute子元素的定位容器 */
      height: 300px;
      background: #fff;
      border-radius: var(--radius);
      margin: 20px 0;
    }
    .pos-abs {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 100px;
      height: 40px;
      background: orange;
    }
    .pos-sticky {
      position: sticky;
      top: 0; /* 滚动到top=0时固定 */
      background: #fff;
      z-index: 99; /* 控制层叠，注意：只有定位元素z-index生效，会创建层叠上下文 */
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .pos-fixed-demo {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      text-align: center;
      line-height: 48px;
    }

    /* ===================== 5. Flex 弹性布局（一维布局，业务80%场景） ===================== */
    .flex-demo {
      display: flex; /* 开启弹性容器，子元素自动成为弹性项 */
      flex-direction: row; /* 主轴方向 row横向/column纵向 */
      justify-content: space-between; /* 主轴对齐 */
      align-items: center; /* 交叉轴对齐 */
      flex-wrap: wrap; /* 允许换行，nowrap不换行 */
      gap: var(--gap); /* 子元素间距，替代margin */
      padding: 16px;
      background: #fff;
      border-radius: var(--radius);
    }
    .flex-item {
      /* flex:1 简写 = flex-grow:1 flex-shrink:1 flex-basis:0% */
      /* grow 剩余空间放大比例；shrink 空间不足缩小比例；basis 基准尺寸 */
      flex: 1;
      min-width: 120px; /* 换行最小宽度，防止挤爆 */
      padding: 16px;
      background: #e8f3ff;
      text-align: center;
    }

    /* ===================== 6. Grid 网格布局（二维布局，现代卡片、页面整体布局） ===================== */
    .grid-demo {
      display: grid; /* 开启网格容器 */
      /* repeat 重复列；auto-fit自动填充；minmax最小最大宽度自适应 */
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      grid-template-rows: auto;
      gap: var(--gap);
      margin: 20px 0;
    }
    .grid-card {
      padding: 20px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ===================== 7. 文本处理：单行/多行省略、字体样式 ===================== */
    .text-demo {
      width: 300px;
      margin: 12px 0;
    }
    /* 单行溢出省略三件套 */
    .one-line-ellipsis {
      white-space: nowrap; /* 禁止换行 */
      overflow: hidden; /* 溢出隐藏 */
      text-overflow: ellipsis; /* 溢出显示省略号 */
    }
    /* webkit内核多行省略（兼容Chrome、Safari、新版Edge） */
    .multi-line-ellipsis {
      display: -webkit-box;
      -webkit-line-clamp: 2; /* 限制行数 */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .text-center { text-align: center; }
    .text-bold { font-weight: 600; }
    .text-uppercase { text-transform: uppercase; }
    .letter-space { letter-spacing: 1px; }

    /* ===================== 8. 视觉样式：渐变、圆角、阴影 ===================== */
    .style-demo {
      width: 260px;
      height: 120px;
      border-radius: 12px;
      /* 线性渐变 linear-gradient，径向 radial-gradient */
      background: linear-gradient(135deg, #1677ff, #722ed1);
      box-shadow: 4px 4px 16px rgba(22,119,255,0.25);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      /* grid快速水平垂直居中 */
      display: grid;
      place-items: center;
    }

    /* ===================== 9. 过渡、变换、关键帧动画 ===================== */
    .animate-box {
      width: 100px;
      height: 100px;
      background: #13c2c2;
      border-radius: var(--radius);
      /* transition：属性 时长 缓动函数，状态切换平滑过渡 */
      transition: all 0.3s ease;
    }
    .animate-box:hover {
      /* transform：形变 rotate旋转 scale缩放 translate位移 skew倾斜 */
      transform: rotate(8deg) scale(1.05) translateX(4px);
    }
    /* @keyframes 定义关键帧动画 */
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .animate-pulse {
      /* 动画名称 时长 循环次数 缓动 */
      animation: pulse 2s infinite ease-in-out;
    }

    /* ===================== 10. 响应式：媒体查询、深色模式 ===================== */
    @media (max-width: 768px) { /* 平板/手机断点 */
      .flex-demo {
        flex-direction: column;
      }
      :root {
        --gap: 12px;
      }
    }
    /* 系统深色模式适配 */
    @media (prefers-color-scheme: dark) {
      body { background: #141414; color: #fff; }
    }

    /* ===================== 11. 常用辅助属性 ===================== */
    .mask {
      opacity: 0.6; /* 透明，元素保留占位，可点击 */
      /* visibility: hidden; 占位，不可见；display:none 不渲染，不占位 */
      pointer-events: none; /* 禁用鼠标点击、hover交互 */
    }
    .optimize {
      will-change: transform; /* 提前通知浏览器该元素会形变，渲染性能优化，慎用 */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="header" class="pos-sticky">
      <h2 class="title">CSS八股示例汇总</h2>
    </div>

    <h3>1. BFC & 浮动清除</h3>
    <div class="box-bfc clearfix">
      <div class="float-left">浮动</div>
      <p>BFC 解决浮动高度塌陷、margin合并</p>
    </div>

    <h3>2. Position 定位演示</h3>
    <div class="pos-wrap">
      <div class="pos-abs">absolute</div>
    </div>

    <h3>3. Flex 布局</h3>
    <div class="flex-demo">
      <div class="flex-item">flex 1</div>
      <div class="flex-item">flex 2</div>
      <div class="flex-item">flex 3</div>
    </div>

    <h3>4. Grid 自适应卡片</h3>
    <div class="grid-demo">
      <div class="grid-card">卡片A</div>
      <div class="grid-card">卡片B</div>
      <div class="grid-card">卡片C</div>
    </div>

    <h3>5. 文本省略</h3>
    <div class="text-demo one-line-ellipsis">单行溢出省略单行溢出省略单行溢出省略单行溢出省略</div>
    <div class="text-demo multi-line-ellipsis">两行省略两行省略两行省略两行省略两行省略两行省略两行省略两行省略</div>

    <h3>6. 渐变、圆角、阴影</h3>
    <div class="style-demo">渐变容器</div>

    <h3>7. transform + transition 过渡动画</h3>
    <div class="animate-box"></div>

    <div class="pos-fixed-demo animate-pulse">↑</div>
  </div>
</body>
</html>
