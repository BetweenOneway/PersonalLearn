version: '3.8'
services:
  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
    command: ["consul", "agent", "-server", "-bootstrap", "-ui", "-client=0.0.0.0"]
    networks:
      - dist-net

  calc1:
    build:
      context: .
    command: python service_calc.py
    depends_on:
      - consul
    networks:
      - dist-net

  calc2:
    build:
      context: .
    command: python service_calc.py
    depends_on:
      - consul
    networks:
      - dist-net

  gateway:
    build:
      context: .
    command: python gateway.py
    ports:
      - "9000:9000"
    depends_on:
      - consul
      - calc1
      - calc2
    networks:
      - dist-net

networks:
  dist-net:
